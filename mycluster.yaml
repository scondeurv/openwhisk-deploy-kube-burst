whisk:
  middleware:
    rabbitmq: "amqp://guest:guest@192.168.1.220:5672"
    redisList: "redis://192.168.1.220:6379"
    redisStream: "redis://192.168.1.220:6379"
  ingress:
     type: NodePort
     apiHostName: 192.168.1.220
     apiHostPort: 31001
     useInternally: false
  versions:
    openwhisk:
      gitTag: "72bb2a1"
  # Aumentar timeouts para permitir subida de ZIPs grandes
  controller:
    timeouts:
      idle: "5 minutes"
      request: "5 minutes"
controller:
  imageName: "manriurv/controller"
  imageTag: "classic"  
invoker:
  imageName: "manriurv/invoker"
  imageTag: "classic"
  containerFactory:
    impl: "docker" 
nginx:
  httpsNodePort: 31001
zookeeper:
  port: 2181
  imageName: "zookeeper"
  imageTag: "3.5"
  readinessProbe:
    enabled: false
k8s:
  persistence:
    enabled: false
